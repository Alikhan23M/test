<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="doctor.js" defer></script>
    <link rel="stylesheet" href="doctor.css">
</head>
<style>
   
</style>
<body>
    <div class="container">
        <header>
            <h1>Doctor Management</h1>
            <p class="subtitle">Manage doctor information and records</p>
        </header>

        <div class="button-container">
            <div class="card" onclick="addDoctor()">
                <h2>Add Doctor</h2>
                <p>Register new doctor information</p>
            </div>
            
            <div class="card" onclick="searchDoctor()">
                <h2>Search Doctor</h2>
                <p>Find doctor details</p>
            </div>
            
            <div class="card" onclick="updateDoctor()">
                <h2>Update Doctor</h2>
                <p>Modify existing doctor records</p>
            </div>
            
            <div class="card" onclick="deleteDoctor()">
                <h2>Delete Doctor</h2>
                <p>Remove doctor from the system</p>
            </div>
        </div>

        <div id="formArea" class="form-container"></div>
        <div id="resultArea" class="result-container"></div>
        <div id="all-doctors" class="doctors">All doctors</div>
    </div>
</body>
</html>
