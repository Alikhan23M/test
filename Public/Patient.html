<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="Patient.js" defer></script>
    <link rel="stylesheet" href="patient.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Patient Management</h1>
            <p class="subtitle">Manage patient information and records</p>
        </header>

        <div class="button-container">
            <div class="card" onclick="addPatient()">
                <h2>Add Patient</h2>
                <p>Register new patient information</p>
            </div>
            
            <div class="card" onclick="searchPatient()">
                <h2>Search Patient</h2>
                <p>Find patient details</p>
            </div>
            
            <div class="card" onclick="updatePatient()">
                <h2>Update Patient</h2>
                <p>Modify existing patient records</p>
            </div>
            
            <div class="card" onclick="deletePatient()">
                <h2>Delete Patient</h2>
                <p>Remove patient from the system</p>
            </div>
        </div>

        <div id="formArea" class="form-container"></div>
        <div id="resultArea" class="result-container"></div>
    </div>
</body>
</html>
